[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langbridge-catalog"
version = "0.1.0a1"
description = "Official connector implementations for Langbridge."
requires-python = ">=3.12"
dependencies = [
    "langbridge-connectors",
    "httpx>=0.27",
]

[project.entry-points."langbridge.connectors"]
shopify = "langbridge.catalog.shopify.connector:ShopifyConnector"

[tool.setuptools.packages.find]
where = ["."]
include = ["langbridge.catalog*"]
